name: Shared libs test (experiment)

on:
  pull_request:
  workflow_dispatch:

jobs:
  shared:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # "without" removes STATIC again, as a negative control
        fix: [with, without]
    name: BUILD_SHARED_LIBS=ON / ${{ matrix.fix }} STATIC
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gfortran ninja-build libopenmpi-dev openmpi-bin

      - name: Remove STATIC (control)
        if: matrix.fix == 'without'
        run: |
          sed -i 's/add_library (pfunit STATIC)/add_library (pfunit)/' src/pfunit/CMakeLists.txt
          sed -i 's/add_library (funit STATIC)/add_library (funit)/' src/funit/CMakeLists.txt
          git diff --stat

      - name: Configure
        run: cmake -B build -G Ninja -DBUILD_SHARED_LIBS=ON
        env:
          FC: gfortran

      - name: Build
        run: cmake --build build --parallel 4

      - name: List libraries
        if: always()
        run: find build -name "lib*funit*" -o -name "lib*pfunit*" | sort
